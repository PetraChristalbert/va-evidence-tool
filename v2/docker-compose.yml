version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
      - ./worker/uploads:/usr/src/app/uploads
      - ./worker/output:/usr/src/app/output
    depends_on:
      - redis
    restart: always

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./worker:/app
      - ./worker/uploads:/app/uploads
      - ./worker/output:/app/output
    depends_on:
      - redis
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: always

volumes:
  redis_data:
  shared_uploads:
  shared_output:
